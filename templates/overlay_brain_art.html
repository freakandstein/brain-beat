<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brain Art — Particle Flow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #010104; overflow: hidden; }
    canvas { display: block; position: fixed; inset: 0; }
    #stars { z-index: 0; }
    #bg    { z-index: 1; }
    #core  { z-index: 2; }
    #main  { z-index: 3; }
    #fx    { z-index: 4; pointer-events: none; }

    #grain {
      position: fixed; inset: 0; z-index: 8; pointer-events: none;
      opacity: 0.035; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    #hud {
      position: fixed;
      top: 22px;
      left: 22px;
      color: rgba(255,255,255,0.6);
      font-family: 'SF Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 10;
      line-height: 2.1;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }
    #hud .row { display: flex; gap: 10px; align-items: center; }
    #hud .bar {
      width: 70px; height: 4px; background: rgba(255,255,255,0.12);
      position: relative; border-radius: 2px; overflow: hidden;
    }
    #hud .bar > span {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: currentColor; border-radius: 2px;
      box-shadow: 0 0 8px currentColor;
      transition: width 0.25s ease-out;
    }
    #hud .alpha { color: #4fa8ff; }
    #hud .beta  { color: #ff5a3c; }
    #hud .theta { color: #c86bff; }

    #state-label {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-family: 'SF Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 7px;
      text-transform: uppercase;
      z-index: 10;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
      transition: color 0.6s ease;
    }
    #state-label::after {
      content: '';
      display: block;
      margin: 8px auto 0;
      width: 40px; height: 2px;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
      opacity: 0.8;
      transition: all 0.6s ease;
    }
    #state-label.calm  { color: #6fc3ff; text-shadow: 0 0 20px rgba(80,170,255,0.7); }
    #state-label.flow  { color: #ffb35c; text-shadow: 0 0 20px rgba(255,160,60,0.7); }
    #state-label.tense { color: #ff5c5c; text-shadow: 0 0 20px rgba(255,60,60,0.7); }

    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 9;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%),
        linear-gradient(rgba(0,0,0,0.25), transparent 15%, transparent 85%, rgba(0,0,0,0.35));
    }
  </style>
</head>
<body>
  <div id="state-label">--</div>
  <div id="hud">
    <div class="row"><span class="alpha">ALPHA</span><div class="bar"><span id="bar-alpha"></span></div></div>
    <div class="row"><span class="beta">BETA</span><div class="bar"><span id="bar-beta"></span></div></div>
    <div class="row"><span class="theta">THETA</span><div class="bar"><span id="bar-theta"></span></div></div>
  </div>
  <canvas id="stars"></canvas>
  <canvas id="bg"></canvas>
  <canvas id="core"></canvas>
  <canvas id="main"></canvas>
  <canvas id="fx"></canvas>
  <div id="grain"></div>
  <div id="vignette"></div>

  <script src="/static/socket.io.min.js"></script>
  <script>
    const starsCanvas = document.getElementById('stars');
    const bgCanvas   = document.getElementById('bg');
    const coreCanvas = document.getElementById('core');
    const mainCanvas = document.getElementById('main');
    const fxCanvas   = document.getElementById('fx');
    const starsCtx = starsCanvas.getContext('2d');
    const bgCtx   = bgCanvas.getContext('2d');
    const coreCtx = coreCanvas.getContext('2d');
    const mainCtx = mainCanvas.getContext('2d');
    const fxCtx   = fxCanvas.getContext('2d');
    let W, H, DPR;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      for (const [cv, ctx] of [[starsCanvas, starsCtx], [bgCanvas, bgCtx], [coreCanvas, coreCtx], [mainCanvas, mainCtx], [fxCanvas, fxCtx]]) {
        cv.width  = Math.floor(window.innerWidth  * DPR);
        cv.height = Math.floor(window.innerHeight * DPR);
        cv.style.width  = window.innerWidth  + 'px';
        cv.style.height = window.innerHeight + 'px';
      }
      W = window.innerWidth; H = window.innerHeight;
      // bg canvas holds the long-exposure trail
      bgCtx.fillStyle = '#010104';
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      buildStars();
    }
    window.addEventListener('resize', resize);

    // ── EEG-driven parameters (smoothed) ───────────────────────────────────
    const eeg = { alpha: 0.5, beta: 0.3, theta: 0.2, spectrum: 0.0 };
    const eegTarget = { alpha: 0.5, beta: 0.3, theta: 0.2, spectrum: 0.0 };
    let stateName = null;

    function smoothEeg() {
      const k = 0.05;
      eeg.alpha    += (eegTarget.alpha    - eeg.alpha)    * k;
      eeg.beta     += (eegTarget.beta     - eeg.beta)     * k;
      eeg.theta    += (eegTarget.theta    - eeg.theta)    * k;
      eeg.spectrum += (eegTarget.spectrum - eeg.spectrum) * k;
    }

    // ── Electrode source points (mirrors TP9/AF7/AF8/TP10 layout) ─────────
    function sourcePoints() {
      const w = W, h = H;
      return {
        AF7:  { x: w * 0.42, y: h * 0.26 },
        AF8:  { x: w * 0.58, y: h * 0.26 },
        TP9:  { x: w * 0.16, y: h * 0.64 },
        TP10: { x: w * 0.84, y: h * 0.64 },
      };
    }
    function centerPoint() { return { x: W * 0.5, y: H * 0.46 }; }

    // ── Starfield backdrop — deep parallax dust ─────────────────────────────
    let stars = [];
    function buildStars() {
      const n = Math.floor((W * H) / 5200);
      stars = [];
      for (let i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.2 + 0.2,
          tw: Math.random() * Math.PI * 2,
          sp: 0.006 + Math.random() * 0.018,
          depth: 0.3 + Math.random() * 0.7,
        });
      }
    }
    function drawStars(t) {
      starsCtx.save();
      starsCtx.scale(DPR, DPR);
      starsCtx.clearRect(0, 0, W, H);
      const hue = baseHue();
      for (const s of stars) {
        const tw = 0.5 + Math.sin(t * s.sp + s.tw) * 0.5;
        const col = hslToRgb(hue + 200, 0.25, 0.85);
        const a = (0.15 + tw * 0.55) * s.depth * (0.5 + eeg.alpha * 0.5);
        starsCtx.fillStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${a.toFixed(3)})`;
        starsCtx.beginPath();
        starsCtx.arc(s.x, s.y, s.r * (0.7 + tw * 0.5), 0, Math.PI * 2);
        starsCtx.fill();
      }
      starsCtx.restore();
    }

    // ── Cheap layered pseudo-noise flow field ──────────────────────────────
    function noise2D(x, y, t, scale) {
      const s = scale;
      return (
        Math.sin(x * 0.0021 * s + t * 0.00012) +
        Math.sin(y * 0.0018 * s - t * 0.00017) +
        Math.sin((x + y) * 0.0013 * s + t * 0.00009) +
        Math.sin((x - y) * 0.0009 * s - t * 0.00006) * 0.6
      ) / 3.6;
    }

    // ── Hue system: spectrum_pos sweeps calm(blue/purple)→flow(amber)→tense(red) ─
    function hslToRgb(h, s, l) {
      h = ((h % 360) + 360) % 360;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r, g, b;
      if (h < 60)       [r, g, b] = [c, x, 0];
      else if (h < 120) [r, g, b] = [x, c, 0];
      else if (h < 180) [r, g, b] = [0, c, x];
      else if (h < 240) [r, g, b] = [0, x, c];
      else if (h < 300) [r, g, b] = [x, 0, c];
      else              [r, g, b] = [c, 0, x];
      return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
    }

    function baseHue() {
      // 0 (calm) → 205 (blue), 0.5 (flow) → 30 (amber), 1 (tense) → 355 (red)
      const sp = eeg.spectrum;
      if (sp < 0.5) return 205 - (sp / 0.5) * 175;   // 205 → 30
      return 30 - ((sp - 0.5) / 0.5) * 35;            // 30 → -5 (wraps to 355)
    }

    // ── Layered particle system (3 depth layers = parallax + bloom depth) ──
    // Pools are allocated at max size, but only the first `activeCount`
    // particles in each layer are simulated/drawn per frame — so particle
    // density itself becomes an EEG-reactive signal (calm = sparse/serene,
    // high arousal = dense/energetic swarm), not just a fixed 1470 total.
    function makeLayer(maxCount, sizeMul, speedMul, alphaMul, hueOffset) {
      const arr = [];
      for (let i = 0; i < maxCount; i++) {
        const p = { sizeMul, speedMul, alphaMul, hueOffset };
        spawnParticle(p);
        p.age = Math.random() * p.life;
        arr.push(p);
      }
      return arr;
    }

    function spawnParticle(p) {
      const srcs = sourcePoints();
      const keys = Object.keys(srcs);
      const key = keys[Math.floor(Math.random() * keys.length)];
      const src = srcs[key];
      const spread = 24 + Math.random() * 40;
      const ang = Math.random() * Math.PI * 2;
      p.x = src.x + Math.cos(ang) * spread * 0.4;
      p.y = src.y + Math.sin(ang) * spread * 0.4;
      p.age = 0;
      p.life = 200 + Math.random() * 340;
      p.channel = key;
      p.wobble = Math.random() * 1000;
    }

    const layerFar  = makeLayer(700, 0.55, 0.55, 0.35, -18);
    const layerMid  = makeLayer(900, 1.0,  1.0,  0.55, 0);
    const layerNear = makeLayer(480, 1.7,  1.55, 0.85, 16);
    const allLayers = [layerFar, layerMid, layerNear];
    let activeCounts = [layerFar.length, layerMid.length, layerNear.length];

    // ── Arousal / chaos: single derived signal that drives *shape*, not
    // just color — this is what makes calm/flow/tense feel structurally
    // different instead of only differently-tinted.
    function computeArousal() {
      // 0 = deeply calm (high alpha, low beta/theta), 1 = maximally tense
      return Math.max(0, Math.min(1, eeg.beta * 0.75 + eeg.theta * 0.15 - eeg.alpha * 0.35 + 0.35));
    }
    // Smoothed float count per layer — the previous version rounded straight
    // to an integer index cutoff, so a particle just past `active` stopped
    // being simulated entirely (position frozen) and reappeared instantly at
    // that stale position the moment the count ticked back up: a visible
    // teleport/freeze rather than a fade. Now the count itself is EMA-
    // smoothed and the boundary particle's alpha ramps fractionally instead
    // of switching on/off in one frame.
    let activeFloats = [layerFar.length * 0.5, layerMid.length * 0.5, layerNear.length * 0.5];
    function updateActiveCounts() {
      const arousal = computeArousal();
      // sparse & serene when calm, dense & swarming when aroused — min floor
      // keeps the piece from ever going empty at rock-bottom arousal
      const frac = 0.28 + arousal * 0.72;
      const targets = allLayers.map(l => Math.max(24, l.length * frac));
      const k = 0.06;
      activeFloats = activeFloats.map((v, i) => v + (targets[i] - v) * k);
      activeCounts = activeFloats.map(v => Math.ceil(v));
    }

    // ── Rotation accumulators ───────────────────────────────────────────────
    // Each ring/orbit keeps its own accumulated angle so speed can change
    // smoothly over time without discontinuities (can't just do t * speed
    // once speed itself depends on live EEG values).
    let lastSpinT = null;
    const petalAngle = [0, 0];       // ring 0, ring 1 (mandala petals)
    const orbitAngle = [0, 0, 0];    // outer orbit rings
    const tiltPhase  = [0, 0, 0];    // slow precession phase per orbit ring

    function advanceSpin(t) {
      if (lastSpinT === null) lastSpinT = t;
      const dt = Math.min(50, t - lastSpinT); // clamp to avoid jumps on tab-away
      lastSpinT = t;

      // Plain constant speed per ring, driven only by live EEG — no extra
      // periodic modulator on top. A previous version added slow sine
      // modulators (~30-50s period) meant to add "variety", but on a short
      // (10-30s) viewing window that reads as the speed changing randomly/
      // inconsistently rather than as a deliberate rhythm — measured
      // objectively smooth frame-to-frame (headless Chrome: 0% dropped
      // frames, consistent pixel deltas) but *perceived* as stutter because
      // the rate of change itself wasn't steady. Removed entirely; each
      // ring still moves at its own distinct, constant ratio so the system
      // reads as multiple independent orbits, not one disc scaled 3x.
      const petalBase = 0.00006 + eeg.beta * 0.00012;
      petalAngle[0] += dt * petalBase * 1.0;
      petalAngle[1] -= dt * petalBase * 1.7;

      const orbitBase = 0.00003 + eeg.beta * 0.00005 + eeg.theta * 0.00004;
      orbitAngle[0] += dt * orbitBase * 1.0;
      orbitAngle[1] -= dt * orbitBase * 0.62;
      orbitAngle[2] += dt * orbitBase * 1.85;

      // Slow precession/tilt phase — alpha (calm/relaxed focus) drives a
      // gentle wobble so the rings feel like they're tumbling in 3D rather
      // than spinning flat on a fixed plane.
      const tiltBase = 0.000025 + eeg.alpha * 0.00006;
      tiltPhase[0] += dt * tiltBase * 1.0;
      tiltPhase[1] += dt * tiltBase * 0.7;
      tiltPhase[2] += dt * tiltBase * 1.3;
    }

    // ── Central neural core — rotating mandala that breathes with the mind ─
    // `arousal` (0=deeply calm, 1=maximally tense) drives *shape*, not just
    // hue: at low arousal the petal ring is a smooth, near-perfect circle;
    // as arousal climbs it becomes jagged/spiky/irregular, so calm vs tense
    // reads as a structural difference you can recognize at a glance even
    // with color removed.
    function shapeJitter(ang, seed, chaos) {
      return (
        Math.sin(ang * 3 + seed) * 0.5 +
        Math.sin(ang * 7 + seed * 1.7) * 0.3 +
        Math.sin(ang * 13 + seed * 2.3) * 0.2
      ) * chaos;
    }

    function drawCore(t) {
      coreCtx.save();
      coreCtx.scale(DPR, DPR);
      coreCtx.clearRect(0, 0, W, H);
      coreCtx.globalCompositeOperation = 'lighter';

      advanceSpin(t);

      const c = centerPoint();
      const hue = baseHue();
      const arousal = computeArousal();
      // breathing pulse: very small, slow, near-constant scale — this used
      // to swing everything (halo/core/rings) in sync at up to ±25%, which
      // read as an ugly synchronized "grow-shrink-grow-shrink" flicker
      // instead of a calm breathing motion. Now capped to a subtle ±6%.
      const pulse = 0.94 + Math.sin(t * 0.00025) * 0.06;
      // Continuous petal count: base 5 always fully visible, up to 5 more
      // fade in individually as arousal rises. A previous version rounded
      // this to an integer (5 + Math.round(arousal*5)) which snapped the
      // whole ring to a new petal count on every crossing — a visible
      // structural "pop" instead of a smooth morph, most noticeable during
      // calm<->tense transitions where arousal sweeps through several
      // integer boundaries in a few seconds.
      const petalFloat = 5 + arousal * 5;
      const petals = 10; // fixed loop bound; extra petals fade via petalFloat
      const baseR = 52 + eeg.alpha * 55 + arousal * 60;
      const chaos = arousal * arousal; // quadratic: stays calm longer, then ramps hard

      // outer halo — bigger & hotter at high arousal, soft & contained when calm
      const haloR = baseR * (2.2 + arousal * 1.2) * pulse;
      const halo = coreCtx.createRadialGradient(c.x, c.y, 0, c.x, c.y, haloR);
      const hc = hslToRgb(hue, 0.85, 0.6);
      halo.addColorStop(0,    `rgba(${hc.r|0},${hc.g|0},${hc.b|0},${((0.18 + arousal * 0.18) * pulse).toFixed(3)})`);
      halo.addColorStop(0.5,  `rgba(${hc.r|0},${hc.g|0},${hc.b|0},${(0.07 * pulse).toFixed(3)})`);
      halo.addColorStop(1,    `rgba(${hc.r|0},${hc.g|0},${hc.b|0},0)`);
      coreCtx.fillStyle = halo;
      coreCtx.beginPath();
      coreCtx.arc(c.x, c.y, haloR, 0, Math.PI * 2);
      coreCtx.fill();

      // calm-state lotus: broad, soft outer petals that bloom open when
      // arousal is low — fades out as arousal climbs (composition changes,
      // not just recoloring). Range widened (was `1 - arousal*2.2`, hit zero
      // at arousal=0.45) to overlap with fractureStrength below — the old
      // versions left a dead zone at arousal 0.45-0.60 where BOTH were zero,
      // so the core briefly looked "bare"/discontinuous every time arousal
      // drifted through that band (e.g. during a calm<->tense transition).
      const lotusStrength = Math.max(0, 1 - arousal * 1.5);
      if (lotusStrength > 0.02) {
        const lotusN = 8;
        const lotusR = baseR * 1.9 * pulse;
        for (let i = 0; i < lotusN; i++) {
          const ang = (i / lotusN) * Math.PI * 2 + petalAngle[0] * 0.3;
          const px = c.x + Math.cos(ang) * lotusR;
          const py = c.y + Math.sin(ang) * lotusR;
          const col = hslToRgb(hue + 10, 0.6, 0.7);
          const r = baseR * 0.55 * lotusStrength;
          const grad = coreCtx.createRadialGradient(px, py, 0, px, py, r);
          grad.addColorStop(0, `rgba(${col.r|0},${col.g|0},${col.b|0},${(0.16 * lotusStrength).toFixed(3)})`);
          grad.addColorStop(1, `rgba(${col.r|0},${col.g|0},${col.b|0},0)`);
          coreCtx.fillStyle = grad;
          coreCtx.beginPath();
          coreCtx.arc(px, py, r, 0, Math.PI * 2);
          coreCtx.fill();
        }
      }

      // tense-state fractures: sharp jagged spikes radiating outward,
      // strengthening with arousal — the other half of the composition swap.
      // Starts earlier (was `arousal-0.55`, now `arousal-0.35`) so it overlaps
      // with lotusStrength above instead of leaving a shared dead zone.
      const fractureStrength = Math.max(0, arousal - 0.35) / 0.65;
      if (fractureStrength > 0.02) {
        const spikeN = 10;
        for (let i = 0; i < spikeN; i++) {
          const ang = (i / spikeN) * Math.PI * 2 + petalAngle[1] * 0.5 + Math.sin(i * 3.1) * 0.2;
          const len = baseR * (1.6 + Math.sin(t * 0.01 + i) * 0.5) * fractureStrength;
          const jag = baseR * 0.18 * fractureStrength;
          const midAng = ang + (Math.sin(i * 7.7 + t * 0.002) * 0.06);
          const x1 = c.x + Math.cos(ang) * baseR * 0.5;
          const y1 = c.y + Math.sin(ang) * baseR * 0.5;
          const xm = c.x + Math.cos(midAng) * (baseR * 0.5 + len * 0.6) + Math.cos(ang + 1.57) * jag;
          const ym = c.y + Math.sin(midAng) * (baseR * 0.5 + len * 0.6) + Math.sin(ang + 1.57) * jag;
          const x2 = c.x + Math.cos(ang) * (baseR * 0.5 + len);
          const y2 = c.y + Math.sin(ang) * (baseR * 0.5 + len);
          const col = hslToRgb(hue - 10, 0.9, 0.6);
          coreCtx.strokeStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${(0.35 * fractureStrength).toFixed(3)})`;
          coreCtx.lineWidth = 1.4;
          coreCtx.beginPath();
          coreCtx.moveTo(x1, y1);
          coreCtx.lineTo(xm, ym);
          coreCtx.lineTo(x2, y2);
          coreCtx.stroke();
        }
      }

      // rotating mandala petals (two counter-rotating rings, each with its
      // own accumulated angle + a theta-driven radius breathing). Per-point
      // radius is jittered by `chaos`: 0 = smooth circle (calm), high = a
      // jagged, irregular silhouette (tense) — the ring's actual geometry
      // changes shape, not only its color.
      for (let ring = 0; ring < 2; ring++) {
        const ringSpin = petalAngle[ring];
        const breathe = 1 + Math.sin(t * 0.0009 + ring * 2.1) * 0.05 * (0.4 + eeg.theta);
        const ringRBase = baseR * (0.7 + ring * 0.55) * pulse * breathe;
        const n = petals + ring * 2;
        const nFloat = petalFloat + ring * 2;
        for (let i = 0; i < n; i++) {
          // Petals beyond the current continuous count fade out instead of
          // disappearing outright — the topmost partial petal ramps its own
          // alpha 0..1 over one full slot, so growth/shrink reads as a fade,
          // not a snap.
          const presence = Math.max(0, Math.min(1, nFloat - i));
          if (presence <= 0.001) continue;
          const ang = (i / n) * Math.PI * 2 + ringSpin;
          const jitter = 1 + shapeJitter(ang, ring * 5.1, chaos) * 0.6;
          // per-point sway: each petal drifts on its own slow, offset phase
          // so the ring doesn't swell/shrink as one rigid uniform shape —
          // still a tiny ±4% wobble, just staggered per point for an
          // organic, non-mechanical feel.
          const sway = 1 + Math.sin(t * 0.0004 + i * 1.9 + ring * 3.3) * 0.04;
          const ringR = ringRBase * jitter * sway;
          const px = c.x + Math.cos(ang) * ringR;
          const py = c.y + Math.sin(ang) * ringR;
          const petalHue = hue + ring * 20 + i * 4;
          const col = hslToRgb(petalHue, 0.85, 0.65);
          const r = (3.5 + eeg.theta * 6 + arousal * 3) * (ring === 0 ? 1 : 0.7);
          const grad = coreCtx.createRadialGradient(px, py, 0, px, py, r * 3);
          grad.addColorStop(0, `rgba(${col.r|0},${col.g|0},${col.b|0},${(0.9 * presence).toFixed(3)})`);
          grad.addColorStop(1, `rgba(${col.r|0},${col.g|0},${col.b|0},0)`);
          coreCtx.fillStyle = grad;
          coreCtx.beginPath();
          coreCtx.arc(px, py, r * 3, 0, Math.PI * 2);
          coreCtx.fill();

          // connecting spokes for the inner ring
          if (ring === 0) {
            coreCtx.strokeStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${((0.22 + eeg.beta * 0.35) * presence).toFixed(3)})`;
            coreCtx.lineWidth = 1;
            coreCtx.beginPath();
            coreCtx.moveTo(c.x, c.y);
            coreCtx.lineTo(px, py);
            coreCtx.stroke();
          }
        }
      }

      // bright core — a steady, clearly visible ember at rest that swells
      // into a surging star under tension. Floor raised so it never shrinks
      // to a bare white dot, and the white hot-spot is pushed to a thin
      // inner sliver (stop 0.12) so the surrounding hue color reads clearly
      // instead of the core looking like "just white".
      const coreR = (20 + eeg.theta * 16 + arousal * 24) * pulse;
      const coreGrad = coreCtx.createRadialGradient(c.x, c.y, 0, c.x, c.y, coreR);
      coreGrad.addColorStop(0,    'rgba(255,255,255,0.95)');
      coreGrad.addColorStop(0.12, `rgba(${hc.r|0},${hc.g|0},${hc.b|0},0.9)`);
      coreGrad.addColorStop(0.55, `rgba(${hc.r|0},${hc.g|0},${hc.b|0},0.5)`);
      coreGrad.addColorStop(1,    `rgba(${hc.r|0},${hc.g|0},${hc.b|0},0)`);
      coreCtx.fillStyle = coreGrad;
      coreCtx.beginPath();
      coreCtx.arc(c.x, c.y, coreR, 0, Math.PI * 2);
      coreCtx.fill();

      // orbit rings — each has its own spin speed, and a slowly-precessing
      // tilt (squash ratio oscillates) so they read like tumbling 3D rings
      // (think Saturn's rings wobbling) rather than static flat ellipses.
      for (let i = 0; i < 3; i++) {
        const rr = baseR * (1.3 + i * 0.5) * pulse;
        const ringCol = hslToRgb(hue + i * 15, 0.7, 0.6);
        const alpha = (0.11 - i * 0.02) * (0.6 + eeg.alpha * 0.5);
        // squash oscillates between near-flat and near-circular — simulates
        // the ring tilting through 3D space as it precesses
        const squash = 0.55 + Math.sin(tiltPhase[i]) * 0.4;
        coreCtx.strokeStyle = `rgba(${ringCol.r|0},${ringCol.g|0},${ringCol.b|0},${Math.max(0, alpha).toFixed(3)})`;
        coreCtx.lineWidth = 1;
        coreCtx.beginPath();
        coreCtx.ellipse(c.x, c.y, rr, rr * squash, orbitAngle[i] * 0.5, 0, Math.PI * 2);
        coreCtx.stroke();

        // a single bright "marker" node riding along the ring, like a
        // planet in orbit — makes the rotation direction/speed legible
        // at a glance instead of only visible via the whole-ring rotation
        const markerAng = orbitAngle[i] * 3.2 + i * 2.1;
        const mx = c.x + Math.cos(markerAng) * rr;
        const my = c.y + Math.sin(markerAng) * rr * squash;
        const markerCol = hslToRgb(hue + i * 15 + 20, 0.9, 0.75);
        const markerA = Math.min(1, alpha * 6);
        coreCtx.fillStyle = `rgba(${markerCol.r|0},${markerCol.g|0},${markerCol.b|0},${markerA.toFixed(3)})`;
        coreCtx.beginPath();
        coreCtx.arc(mx, my, 2.2, 0, Math.PI * 2);
        coreCtx.fill();
      }

      coreCtx.restore();
    }

    // ── Ambient orbs at each electrode — breathing glow anchors ────────────
    function drawElectrodeGlow(ctx, t) {
      const srcs = sourcePoints();
      const hue = baseHue();
      let i = 0;
      for (const key in srcs) {
        const { x, y } = srcs[key];
        const phase = t * 0.0003 + i * 1.7;
        const pulse = 0.85 + Math.sin(phase) * 0.15;
        const r = hslToRgb(hue + i * 6, 0.85, 0.6);
        const radius = (34 + eeg.theta * 40 + computeArousal() * 38) * (0.9 + pulse * 0.15);
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0,   `rgba(${r.r|0},${r.g|0},${r.b|0},${(0.35 * pulse).toFixed(3)})`);
        grad.addColorStop(0.4, `rgba(${r.r|0},${r.g|0},${r.b|0},${(0.12 * pulse).toFixed(3)})`);
        grad.addColorStop(1,   `rgba(${r.r|0},${r.g|0},${r.b|0},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

        // crisp bright center point + thin ring for a "sensor" look
        const core = hslToRgb(hue + i * 6, 0.9, 0.8);
        ctx.fillStyle = `rgba(${core.r|0},${core.g|0},${core.b|0},${(0.7 * pulse).toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(x, y, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(${core.r|0},${core.g|0},${core.b|0},${(0.3 * pulse).toFixed(3)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 9 + pulse * 3, 0, Math.PI * 2);
        ctx.stroke();
        i++;
      }
    }

    // ── Faint connective energy lines between electrode pairs + to core ────
    function drawConnections(ctx, t) {
      const srcs = sourcePoints();
      const pts = Object.values(srcs);
      const hue = baseHue();
      const r = hslToRgb(hue, 0.7, 0.65);
      ctx.lineWidth = 1;
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const a = pts[i], b = pts[j];
          const flicker = 0.5 + Math.sin(t * 0.0008 + i * 3 + j) * 0.5;
          const alpha = (0.05 + eeg.beta * 0.10) * flicker;
          ctx.strokeStyle = `rgba(${r.r|0},${r.g|0},${r.b|0},${alpha.toFixed(3)})`;
          const midx = (a.x + b.x) / 2 + Math.sin(t * 0.0006 + i) * 30;
          const midy = (a.y + b.y) / 2 + Math.cos(t * 0.0006 + j) * 30;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.quadraticCurveTo(midx, midy, b.x, b.y);
          ctx.stroke();
        }
      }
      // pulse lines from each electrode toward the core (traveling dash)
      const c = centerPoint();
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i];
        const alpha = (0.06 + eeg.beta * 0.08);
        ctx.strokeStyle = `rgba(${r.r|0},${r.g|0},${r.b|0},${alpha.toFixed(3)})`;
        ctx.setLineDash([3, 7]);
        ctx.lineDashOffset = -t * (0.02 + eeg.beta * 0.05);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(c.x, c.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function drawParticles(t) {
      const hue = baseHue();
      const speedBase = 0.4 + eeg.beta * 1.4;
      const driftMul  = 0.4 + eeg.alpha * 0.9;
      const turbulence = 0.35 + eeg.beta * 1.4;
      const sizeBase = 0.6 + eeg.theta * 2.0;

      mainCtx.globalCompositeOperation = 'lighter';

      for (let li = 0; li < allLayers.length; li++) {
        const layer = allLayers[li];
        const active = activeCounts[li];
        const activeFloat = activeFloats[li];
        for (let pi = 0; pi < active; pi++) {
          const p = layer[pi];
          // Fractional presence: fully 1 while comfortably under the smoothed
          // count, ramps 0..1 across the single boundary slot so a particle
          // entering/leaving activation fades instead of popping.
          const presence = Math.max(0, Math.min(1, activeFloat - pi));
          if (presence <= 0.001) continue;
          const n = noise2D(p.x * turbulence, p.y * turbulence, t + p.wobble, p.sizeMul);
          const angle = n * Math.PI * 2.4;
          const speed = speedBase * p.speedMul;
          const vx = Math.cos(angle) * speed * driftMul;
          const vy = Math.sin(angle) * speed * driftMul - 0.22;

          const px = p.x, py = p.y;
          p.x += vx;
          p.y += vy;
          p.age++;

          if (p.age > p.life || p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30) {
            spawnParticle(p);
            continue;
          }

          const lifeRatio = 1 - p.age / p.life;
          const fadeIn = Math.min(1, p.age / 20);
          const alpha = Math.max(0, lifeRatio) * p.alphaMul * fadeIn * presence;
          const size = sizeBase * p.sizeMul;
          const col = hslToRgb(hue + p.hueOffset + n * 24, 0.85, 0.62);

          mainCtx.strokeStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${alpha.toFixed(3)})`;
          mainCtx.lineWidth = size;
          mainCtx.beginPath();
          mainCtx.moveTo(px, py);
          mainCtx.lineTo(p.x, p.y);
          mainCtx.stroke();

          // bright core dot on near layer for sparkle
          if (p.sizeMul > 1.3 && Math.random() < 0.04) {
            mainCtx.fillStyle = `rgba(255,255,255,${(alpha * 0.8).toFixed(3)})`;
            mainCtx.beginPath();
            mainCtx.arc(p.x, p.y, size * 0.9, 0, Math.PI * 2);
            mainCtx.fill();
          }
        }
      }
      mainCtx.globalCompositeOperation = 'source-over';
    }

    // ── Background: slow long-exposure accumulation for depth/history ─────
    function drawBackground() {
      // theta lengthens trail persistence; beta shortens it (more energy = faster refresh)
      const fade = 0.045 + eeg.beta * 0.05 - eeg.theta * 0.02;
      bgCtx.save();
      bgCtx.scale(DPR, DPR);
      bgCtx.fillStyle = `rgba(1,1,4,${Math.max(0.02, Math.min(0.12, fade)).toFixed(3)})`;
      bgCtx.fillRect(0, 0, W, H);
      bgCtx.restore();
    }

    // ── Occasional shooting "thought spark" bursts on high beta ────────────
    let lastBurst = 0;
    const shockwaves = [];
    function maybeBurst(t) {
      if (t - lastBurst < 900) return;
      const chance = 0.002 + eeg.beta * 0.01;
      if (Math.random() < chance) {
        lastBurst = t;
        const srcs = sourcePoints();
        const keys = Object.keys(srcs);
        const from = srcs[keys[Math.floor(Math.random() * keys.length)]];
        spawnBurst(from.x, from.y);
        shockwaves.push({ x: from.x, y: from.y, age: 0, life: 50 });
      }
    }

    const bursts = [];
    function spawnBurst(x, y) {
      const n = 34;
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2 + Math.random() * 0.3;
        const speed = 2.5 + Math.random() * 4;
        bursts.push({
          x, y,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed,
          age: 0, life: 40 + Math.random() * 24,
        });
      }
    }

    function drawBursts() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      fxCtx.save();
      fxCtx.scale(DPR, DPR);
      fxCtx.globalCompositeOperation = 'lighter';
      const hue = baseHue();
      const col = hslToRgb(hue + 30, 0.9, 0.7);

      // expanding shockwave rings
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.age++;
        if (s.age > s.life) { shockwaves.splice(i, 1); continue; }
        const p = s.age / s.life;
        const rad = p * 160;
        const a = (1 - p) * 0.5;
        fxCtx.strokeStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${a.toFixed(3)})`;
        fxCtx.lineWidth = 2 * (1 - p) + 0.3;
        fxCtx.beginPath();
        fxCtx.arc(s.x, s.y, rad, 0, Math.PI * 2);
        fxCtx.stroke();
      }

      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.x += b.vx; b.y += b.vy;
        b.vx *= 0.96; b.vy *= 0.96;
        b.age++;
        if (b.age > b.life) { bursts.splice(i, 1); continue; }
        const a = 1 - b.age / b.life;
        // motion streak
        fxCtx.strokeStyle = `rgba(${col.r|0},${col.g|0},${col.b|0},${(a * 0.5).toFixed(3)})`;
        fxCtx.lineWidth = 1.4 * a;
        fxCtx.beginPath();
        fxCtx.moveTo(b.x, b.y);
        fxCtx.lineTo(b.x - b.vx * 2.2, b.y - b.vy * 2.2);
        fxCtx.stroke();
        fxCtx.fillStyle = `rgba(255,255,255,${(a * 0.9).toFixed(3)})`;
        fxCtx.beginPath();
        fxCtx.arc(b.x, b.y, 2.2 * a + 0.4, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }

    // ── State label class swap ──────────────────────────────────────────
    function applyStateClass(s) {
      const el = document.getElementById('state-label');
      el.classList.remove('calm', 'flow', 'tense');
      if (s) el.classList.add(s);
      el.textContent = s ? s.toUpperCase() : '--';
    }

    // ── HUD ─────────────────────────────────────────────────────────────
    function updateHud() {
      document.getElementById('bar-alpha').style.width = Math.round(eeg.alpha * 100) + '%';
      document.getElementById('bar-beta').style.width  = Math.round(eeg.beta  * 100) + '%';
      document.getElementById('bar-theta').style.width = Math.round(eeg.theta * 100) + '%';
    }

    // ── Socket.IO — driven by EEG state_update ────────────────────────────
    const socket = io();
    socket.on('state_update', data => {
      if (typeof data.alpha === 'number') eegTarget.alpha = data.alpha;
      if (typeof data.beta  === 'number') eegTarget.beta  = data.beta;
      if (typeof data.theta === 'number') eegTarget.theta = data.theta;
      if (typeof data.spectrum_pos === 'number') eegTarget.spectrum = data.spectrum_pos;
      if (data.state && data.state !== stateName) {
        stateName = data.state;
        applyStateClass(stateName);
      }
    });

    // ── Main loop ──────────────────────────────────────────────────────────
    function loop(t) {
      smoothEeg();
      updateActiveCounts();
      drawStars(t);
      drawBackground();

      mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      mainCtx.save();
      mainCtx.scale(DPR, DPR);
      drawElectrodeGlow(mainCtx, t);
      drawConnections(mainCtx, t);
      mainCtx.restore();

      drawCore(t);

      mainCtx.save();
      mainCtx.scale(DPR, DPR);
      drawParticles(t);
      mainCtx.restore();

      maybeBurst(t);
      drawBursts();

      updateHud();
      requestAnimationFrame(loop);
    }

    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
